<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>오늘의 독박</title>
<meta name="theme-color" content="#14162B">
<meta name="description" content="광고 없이 바로 뽑는 복불복 · 독박 금액 계산">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="오늘의 독박">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
/* 레이아웃: 폰 한 화면 앱. 화면(section) 하나씩 보여주고, 시트는 아래에서 올라옴 */
:root{
  --bg:#14162B; --card:#1E2140; --line:#34375A; --deep:#0B0C18;
  --fg:#F4F2EA; --mute:#B9B8C9; --accent:#FFD447; --red:#FF5C7A; --green:#7CE38B;
  --display:'Jua','Noto Sans KR',system-ui,sans-serif;
  --body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:440px;margin:0 auto;height:100%;position:relative}
.screen{height:100%;display:flex;flex-direction:column;gap:16px;padding-block:20px 18px;overflow-y:auto}
.screen.fixed{overflow:hidden}
.disp{font-family:var(--display);font-weight:400}
.mute{color:var(--mute)}
.top{display:flex;align-items:center;gap:10px}
.icon-btn{width:44px;height:44px;flex:none;border-radius:14px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.badge{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:12px;font-size:11px;font-weight:700;white-space:nowrap;background:var(--bg);border:1px solid var(--line);color:var(--mute)}
.badge.multi{color:var(--accent);border-color:#6B5E2A;background:#24233A}
.btn{height:54px;border-radius:16px;border:none;background:var(--accent);color:var(--bg);font-family:var(--display);font-size:20px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--fg)}
.btn:active{transform:scale(.98)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* 홈 */
.title{font-size:34px;line-height:1.1;color:var(--accent)}
.stepper{display:flex;gap:10px}
.round{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:26px;font-weight:700;line-height:1}
.round.plus{background:var(--accent);border:none;color:var(--bg)}
.names{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.names label{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 4px 0 10px;height:40px}
.names .dot{width:10px;height:10px;border-radius:50%;flex:none}
.names input{width:64px;border:none;background:transparent;font-size:14px;font-weight:700;padding:0;outline:none}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.game{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.game.hot{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.game.hot .badge{background:rgba(20,22,43,.14);border-color:transparent;color:var(--bg)}
.game.hot small{color:var(--bg);opacity:.75;font-weight:700}
.game .g-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.game b{font-family:var(--display);font-weight:400;font-size:21px;display:block}
.game small{font-size:12px;color:var(--mute)}
.amt-in{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:17px;font-weight:700;padding:0 14px;width:100%;font-variant-numeric:tabular-nums}
.amt-in::placeholder{color:#7D7F9C;font-weight:400}

/* 손가락 */
.touch{flex:1;position:relative;border-radius:24px;background:var(--deep);border:1px dashed var(--line);touch-action:none;overflow:hidden;user-select:none;-webkit-user-select:none}
.touch .hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:20px;pointer-events:none}
.fdot{position:absolute;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;border:7px solid;pointer-events:none;transition:opacity .3s,transform .3s;animation:pop .25s ease-out}
.fdot.out{opacity:.12}
.fdot.win{transform:scale(1.35)}
.count{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:96px;height:96px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:54px;color:var(--accent);pointer-events:none}
@keyframes pop{from{transform:scale(.4);opacity:0}}

/* 돌림판 */
.wheel-wrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
.wheel-wrap canvas{max-width:100%;height:auto}
.pin{position:absolute;top:calc(50% - var(--wr) - 6px);left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:28px solid var(--accent);filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}

/* 사다리 */
.ladder-box{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.lad-top,.lad-bot{display:grid;gap:4px}
.lad-top button{height:44px;border-radius:12px;border:2px solid;background:var(--card);font-size:12px;font-weight:700;padding:0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lad-top button:disabled{opacity:.45}
.lad-bot span{height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:16px;color:var(--mute)}
.lad-bot span.lose{background:var(--red);border-color:var(--red);color:var(--bg)}
.lad-bot span.pass{color:var(--green)}
.ladder-box svg{flex:1;min-height:0;width:100%}

/* 폭탄 */
.bomb-area{flex:1;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0;min-height:0}
.bomb-area svg{width:min(240px,60vw);height:auto}
.shake{animation:shake .18s linear}
@keyframes shake{25%{transform:translate(-4px,2px) rotate(-3deg)}75%{transform:translate(4px,-2px) rotate(3deg)}}
.bump{animation:bump .22s ease-out}
@keyframes bump{50%{transform:scale(.9)}}
.stats{display:flex;justify-content:center;gap:10px}
.stat{padding:8px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;min-width:92px}
.stat span:first-child{font-size:11px;color:var(--mute)}
.stat span:last-child{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:5px;background:var(--card);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--red));border-radius:5px;transition:width .3s linear}
.flash{position:fixed;inset:0;background:var(--red);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:96px;color:var(--bg);z-index:50;animation:boom .5s ease-out}
@keyframes boom{from{transform:scale(1.4);opacity:0}}

/* 결과 */
.win-head{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:8px}
.win-head .big{font-size:56px;line-height:1;color:var(--accent)}
.win-swatch{width:84px;height:84px;border-radius:50%;border:8px solid;box-shadow:0 0 0 12px rgba(255,255,255,.05)}
.win-name{font-size:30px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{height:40px;border-radius:10px;border:none;background:transparent;font-size:13px;font-weight:700;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.split{display:flex;flex-direction:column;gap:8px}
.split div{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums}
.split .lose{font-size:15px;font-weight:700}
.split .lose strong{font-family:var(--display);font-weight:400;font-size:30px;color:var(--accent)}
.split .rest strong{font-size:17px}
.note{font-size:12px;color:var(--mute)}

/* 시트 */
.scrim{position:fixed;inset:0;background:rgba(5,6,14,.72);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:440px;background:var(--card);border-top:1px solid var(--line);border-radius:28px 28px 0 0;padding:12px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40%);opacity:0}}
.grab{align-self:center;width:44px;height:5px;border-radius:3px;background:#4A4C6A}
.opt{text-align:left;border-radius:20px;padding:18px;display:flex;gap:14px;align-items:center;border:1px solid var(--line);background:var(--bg)}
.opt.main{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.opt b{font-family:var(--display);font-weight:400;font-size:21px;display:block}
.opt small{font-size:13px}
.opt:not(.main) small{color:var(--mute)}
.switch{display:flex;justify-content:space-between;align-items:center;height:52px}
.switch button{width:58px;height:32px;border-radius:16px;border:none;background:var(--line);position:relative}
.switch button::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--fg);transition:left .15s}
.switch button[aria-pressed="true"]{background:var(--accent)}
.switch button[aria-pressed="true"]::after{left:30px;background:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="app">

<!-- 홈 -->
<section class="screen" id="home">
  <div class="top" style="justify-content:space-between">
    <div>
      <div class="disp title">오늘의 독박</div>
      <div class="mute" style="font-size:13px">광고 없이 바로 뽑는 복불복</div>
    </div>
    <button class="icon-btn" id="openSet" aria-label="설정">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
    </button>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <div class="mute" style="font-size:12px">참가 인원 · 이름은 눌러서 바꾸기</div>
        <div style="font-size:26px;font-weight:900" id="nLabel">4명</div>
      </div>
      <div class="stepper">
        <button class="round" id="minus" aria-label="인원 빼기">−</button>
        <button class="round plus" id="plus" aria-label="인원 더하기">+</button>
      </div>
    </div>
    <div class="names" id="names"></div>
  </div>

  <div class="mute" style="font-size:14px;font-weight:700">게임 고르기</div>
  <div class="games">
    <button class="game hot" data-game="finger">
      <span class="g-top">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11V5a2 2 0 0 1 4 0v6"></path><path d="M13 10.5V9a2 2 0 0 1 4 0v4"></path><path d="M9 11.5V10a2 2 0 0 0-4 0v4a8 8 0 0 0 8 8h1a6 6 0 0 0 6-6v-3a2 2 0 0 0-3-1.7"></path></svg>
        <span class="badge"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5"></rect></svg>폰 1대</span>
      </span>
      <span><b>손가락 뽑기</b><small>화면에 올리면 1명</small></span>
    </button>
    <button class="game" data-game="wheel">
      <span class="g-top">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FF7A59" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 3v9l6.4 6.4"></path><path d="M12 12 3.6 15"></path></svg>
        <span class="badge"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5"></rect></svg>폰 1대</span>
      </span>
      <span><b>돌림판</b><small>이름 넣고 빙글</small></span>
    </button>
    <button class="game" data-game="ladder">
      <span class="g-top">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#6FD3FF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 3v18M12 3v18M19 3v18M5 8h7M12 13h7M5 17h7"></path></svg>
        <span class="badge multi"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="2" y="5" width="10" height="16" rx="2"></rect><path d="M15 3h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"></path></svg>각자 폰 OK</span>
      </span>
      <span><b>사다리</b><small>숨은 독박 1칸</small></span>
    </button>
    <button class="game" data-game="bomb">
      <span class="g-top">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FF5C7A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="14" r="7"></circle><path d="M15 8.5 17.5 6M18 3v1.5M21 6h-1.5M19.8 3.8l-1 1"></path></svg>
        <span class="badge multi"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="2" y="5" width="10" height="16" rx="2"></rect><path d="M15 3h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"></path></svg>각자 폰 OK</span>
      </span>
      <span><b>폭탄 돌리기</b><small>터지면 독박</small></span>
    </button>
  </div>

  <div class="card" style="margin-top:auto;display:flex;flex-direction:column;gap:10px">
    <label for="amt" style="font-size:14px;font-weight:700">독박 금액 같이 계산 <span class="mute" style="font-weight:400">(선택)</span></label>
    <input id="amt" class="amt-in" type="text" inputmode="numeric" placeholder="예) 커피값 24,000" autocomplete="off">
  </div>
</section>

<!-- 손가락 뽑기 -->
<section class="screen fixed" id="finger" hidden>
  <div class="top">
    <button class="icon-btn back" aria-label="뒤로"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
    <div class="disp" style="font-size:24px">손가락 뽑기</div>
    <div class="mute" style="margin-left:auto;font-size:13px" id="fCount">0명</div>
  </div>
  <div class="touch" id="touch">
    <div class="hint" id="fHint">
      <div style="font-size:18px;font-weight:700">모두 손가락을 화면에 올려주세요</div>
      <div class="mute" style="font-size:13px">2명 이상 올리면 3초 뒤에 1명을 뽑아요</div>
    </div>
    <div class="count" id="fNum" hidden>3</div>
  </div>
</section>

<!-- 돌림판 -->
<section class="screen fixed" id="wheel" hidden>
  <div class="top">
    <button class="icon-btn back" aria-label="뒤로"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
    <div class="disp" style="font-size:24px">돌림판</div>
    <div class="mute" style="margin-left:auto;font-size:13px" id="wCount"></div>
  </div>
  <div class="wheel-wrap" id="wWrap">
    <canvas id="wCanvas" width="680" height="680" aria-label="참가자 돌림판"></canvas>
    <div class="pin" aria-hidden="true"></div>
  </div>
  <button class="btn" id="spin">돌리기</button>
</section>

<!-- 사다리 -->
<section class="screen fixed" id="ladder" hidden>
  <div class="top">
    <button class="icon-btn back" aria-label="뒤로"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
    <div class="disp" style="font-size:24px">사다리</div>
    <div class="mute" style="margin-left:auto;font-size:13px">이름을 눌러 타보기</div>
  </div>
  <div class="ladder-box">
    <div class="lad-top" id="ladTop"></div>
    <svg id="ladSvg" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div class="lad-bot" id="ladBot"></div>
  </div>
  <div class="row2">
    <button class="btn ghost" id="ladNew">새 사다리</button>
    <button class="btn" id="ladAll">독박 바로 공개</button>
  </div>
</section>

<!-- 폭탄 돌리기 -->
<section class="screen fixed" id="bomb" hidden>
  <div class="top">
    <button class="icon-btn back" aria-label="뒤로"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
    <div class="disp" style="font-size:24px">폭탄 돌리기</div>
    <span class="badge" style="margin-left:auto" id="bBadge">폰 1대</span>
  </div>
  <div class="stats">
    <div class="stat"><span>넘긴 횟수</span><span id="bPass" style="color:var(--accent)">0</span></div>
    <div class="stat"><span>남은 시간</span><span style="color:var(--red)">???</span></div>
  </div>
  <button class="bomb-area" id="bombBtn" aria-label="탭하고 다음 사람에게 넘기기">
    <svg viewBox="0 0 240 240" fill="none" aria-hidden="true" id="bombSvg">
      <circle cx="112" cy="140" r="96" fill="#FF5C7A" opacity=".08"></circle>
      <circle cx="112" cy="140" r="78" fill="#2B2E52" stroke="#4A4C6A" stroke-width="4"></circle>
      <path d="M72 110a46 46 0 0 1 34-26" stroke="#5B5E86" stroke-width="10" stroke-linecap="round"></path>
      <rect x="138" y="58" width="34" height="26" rx="6" transform="rotate(35 155 71)" fill="#4A4C6A"></rect>
      <path d="M168 58c8-14 20-18 30-14" stroke="#B9B8C9" stroke-width="5" stroke-linecap="round"></path>
      <g id="spark"><path d="M204 44l10-10M206 28l-2-12M216 50l14 2M196 30l-8-10M220 38l12-8" stroke="#FFD447" stroke-width="5" stroke-linecap="round"></path><circle cx="202" cy="42" r="8" fill="#FF7A59"></circle></g>
    </svg>

<div class="toast" id="toast" hidden></div>

<script>
(function(){
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const PAL = [['#FFD447','노랑'],['#FF7A59','주황'],['#6FD3FF','하늘'],['#7CE38B','초록'],['#FF5C7A','분홍'],['#B79CFF','보라'],['#F4F2EA','하양'],['#4FE3C1','민트'],['#FF9F1C','귤색'],['#5C8DFF','파랑']];
const MAXN = 10, MINN = 2;

const S = {n:4, names:[], amount:0, rule:'all', sound:true, vib:true, game:null, last:null};
function load(){ try{ const d = JSON.parse(localStorage.getItem('dokbak')||'{}'); Object.assign(S, {n:d.n||4, names:d.names||[], rule:d.rule||'all', sound:d.sound!==false, vib:d.vib!==false}); }catch(e){} }
function save(){ try{ localStorage.setItem('dokbak', JSON.stringify({n:S.n,names:S.names,rule:S.rule,sound:S.sound,vib:S.vib})); }catch(e){} }
const nameOf = i => (S.names[i] && S.names[i].trim()) || (i+1)+'번';
const won = v => v.toLocaleString('ko-KR')+'원';

/* 소리·진동 */
let ac = null;
function audio(){ if(!S.sound) return null; try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){ ac=null; } return ac; }
function beep(f=660, d=.08, type='square', v=.06){ const a=audio(); if(!a) return; const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.value=f; g.gain.setValueAtTime(v,a.currentTime); g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d); o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime+d+.02); }
function boomSound(){ const a=audio(); if(!a) return; const len=a.sampleRate*1.1, b=a.createBuffer(1,len,a.sampleRate), ch=b.getChannelData(0); for(let i=0;i<len;i++) ch[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5); const s=a.createBufferSource(), g=a.createGain(), f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900; g.gain.value=.7; s.buffer=b; s.connect(f).connect(g).connect(a.destination); s.start(); }
function fanfare(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.14,'triangle',.08),i*110)); }
function buzz(p){ if(!S.vib) return; try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }

/* 화면 전환 */
let cleanup = null;
function show(id){ if(cleanup){ cleanup(); cleanup=null; } $$('.screen').forEach(s=>s.hidden = s.id!==id); window.scrollTo(0,0); }
let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,2200); }

/* 금액 입력 */
function parseAmt(v){ return parseInt(String(v).replace(/[^0-9]/g,''),10)||0; }
function bindAmt(el){ el.addEventListener('input',()=>{ S.amount = Math.min(parseAmt(el.value), 99999999); el.value = S.amount? S.amount.toLocaleString('ko-KR') : ''; if(el.id==='rAmt') renderSplit(); }); }
bindAmt($('#amt')); bindAmt($('#rAmt'));

/* 홈 */
function renderHome(){
  $('#nLabel').textContent = S.n+'명';
  $('#minus').disabled = S.n<=MINN; $('#plus').disabled = S.n>=MAXN;
  const box = $('#names'); box.innerHTML='';
  for(let i=0;i<S.n;i++){
    const l=document.createElement('label'); l.htmlFor='nm'+i;
    l.innerHTML='<span class="dot" style="background:'+PAL[i][0]+'"></span>';
    const inp=document.createElement('input'); inp.id='nm'+i; inp.maxLength=6; inp.placeholder=(i+1)+'번'; inp.value=S.names[i]||'';
    inp.addEventListener('input',()=>{ S.names[i]=inp.value; save(); });
    l.appendChild(inp); box.appendChild(l);
  }
  $('#amt').value = S.amount? S.amount.toLocaleString('ko-KR') : '';
}
$('#minus').onclick=()=>{ if(S.n>MINN){ S.n--; save(); renderHome(); } };
$('#plus').onclick=()=>{ if(S.n<MAXN){ S.n++; save(); renderHome(); } };
$$('.game').forEach(b=>b.onclick=()=>{ audio(); const g=b.dataset.game; if(g==='ladder'||g==='bomb') openMode(g); else start(g); });

/* 참여 방식 시트 */
let modeGame=null;
function openMode(g){ modeGame=g; $('#mTitle').textContent = g==='bomb'?'폭탄 돌리기':'사다리'; $('#mOneSub').textContent = g==='bomb'?'폰을 넘기다 터지면 독박':'한 화면에서 이름 눌러 타기'; $('#modeSheet').hidden=false; $('#mOne').focus(); }
$('#mOne').onclick=()=>{ $('#modeSheet').hidden=true; start(modeGame); };
$('#mRoom').onclick=()=>toast('방 만들기는 다음 업데이트에서 열려요');
$('#mCancel').onclick=()=>$('#modeSheet').hidden=true;
$('#modeSheet').onclick=e=>{ if(e.target.id==='modeSheet') $('#modeSheet').hidden=true; };

/* 설정 */
function renderSet(){ $('#tSound').setAttribute('aria-pressed',S.sound); $('#tVib').setAttribute('aria-pressed',S.vib); }
$('#openSet').onclick=()=>{ renderSet(); $('#setSheet').hidden=false; };
$('#tSound').onclick=()=>{ S.sound=!S.sound; save(); renderSet(); beep(); };
$('#tVib').onclick=()=>{ S.vib=!S.vib; save(); renderSet(); buzz(60); };
$('#sClose').onclick=()=>$('#setSheet').hidden=true;
$('#setSheet').onclick=e=>{ if(e.target.id==='setSheet') $('#setSheet').hidden=true; };
$$('.back').forEach(b=>b.onclick=()=>{ show('home'); renderHome(); });

function start(g){ S.game=g; ({finger:startFinger, wheel:startWheel, ladder:startLadder, bomb:startBomb})[g](); }

/* ── 손가락 뽑기 ── */
function startFinger(){
  show('finger');
  const area=$('#touch'), num=$('#fNum'), hint=$('#fHint');
  const pts=new Map(); let locked=false, cd=null, lastCount=0, mid=0;
  [...area.querySelectorAll('.fdot')].forEach(d=>d.remove());
  num.hidden=true; hint.hidden=false; $('#fCount').textContent='0명';
  const usedColor=()=>{ const u=new Set([...pts.values()].map(p=>p.c)); for(let i=0;i<PAL.length;i++) if(!u.has(i)) return i; return pts.size%PAL.length; };
  function add(id,x,y){ if(locked||pts.size>=PAL.length) return; const r=area.getBoundingClientRect(); const c=usedColor(); const el=document.createElement('div'); el.className='fdot'; el.style.borderColor=PAL[c][0]; el.style.boxShadow='0 0 0 12px '+PAL[c][0]+'26'; area.appendChild(el); pts.set(id,{c,el}); move(id,x,y); beep(440+c*60,.05,'sine',.05); }
  function move(id,x,y){ const p=pts.get(id); if(!p) return; const r=area.getBoundingClientRect(); p.el.style.left=(x-r.left)+'px'; p.el.style.top=(y-r.top)+'px'; }
  function del(id){ if(locked) return; const p=pts.get(id); if(!p) return; p.el.remove(); pts.delete(id); }
  function update(){
    if(locked) return;
    const k=pts.size; $('#fCount').textContent=k+'명'; hint.hidden=k>0;
    if(k===lastCount) return; lastCount=k;
    clearInterval(cd); num.hidden=true;
    if(k<2) return;
    let left=3; num.hidden=false; num.textContent=left; beep(700);
    cd=setInterval(()=>{ left--; if(left>0){ num.textContent=left; beep(700); } else { clearInterval(cd); pick(); } },1000);
  }
  function pick(){
    locked=true; num.hidden=true;
    const ids=[...pts.keys()]; const w=ids[Math.floor(Math.random()*ids.length)];
    pts.forEach((p,id)=>p.el.classList.add(id===w?'win':'out'));
    const wp=pts.get(w); wp.el.style.background=PAL[wp.c][0];
    fanfare(); buzz([80,60,200]);
    const n=ids.length;
    setTimeout(()=>result({name:PAL[wp.c][1]+' 손가락', color:PAL[wp.c][0], sub:n+'명 중 1명', n}),1400);
  }
  const ts=e=>{ e.preventDefault(); for(const t of e.changedTouches) add('t'+t.identifier,t.clientX,t.clientY); update(); };
  const tm=e=>{ e.preventDefault(); for(const t of e.changedTouches) move('t'+t.identifier,t.clientX,t.clientY); };
  const te=e=>{ e.preventDefault(); for(const t of e.changedTouches) del('t'+t.identifier); update(); };
  const pd=e=>{ if(e.pointerType!=='mouse') return; const hit=e.target.closest&&e.target.closest('.fdot'); if(hit){ for(const [id,p] of pts) if(p.el===hit) del(id); } else add('m'+(mid++),e.clientX,e.clientY); update(); };
  const pd2=e=>{ if(e.pointerType!=='mouse'||locked) return; const r=area.getBoundingClientRect(); for(const [id,p] of pts){ const dx=e.clientX-(parseFloat(p.el.style.left)+r.left), dy=e.clientY-(parseFloat(p.el.style.top)+r.top); if(dx*dx+dy*dy<52*52){ del(id); update(); e.stopImmediatePropagation(); return; } } };
  area.addEventListener('touchstart',ts,{passive:false}); area.addEventListener('touchmove',tm,{passive:false});
  area.addEventListener('touchend',te,{passive:false}); area.addEventListener('touchcancel',te,{passive:false});
  area.addEventListener('pointerdown',pd2,true); area.addEventListener('pointerdown',pd);
  cleanup=()=>{ clearInterval(cd); area.removeEventListener('touchstart',ts); area.removeEventListener('touchmove',tm); area.removeEventListener('touchend',te); area.removeEventListener('touchcancel',te); area.removeEventListener('pointerdown',pd2,true); area.removeEventListener('pointerdown',pd); };
}

/* ── 돌림판 ── */
let wRot=0;
function startWheel(){
  show('wheel');
  const cv=$('#wCanvas'), ctx=cv.getContext('2d'), n=S.n, A=Math.PI*2/n;
  $('#wCount').textContent=n+'명'; $('#spin').disabled=false;
  let spinning=false, raf=0;
  function size(){ const w=$('#wWrap'); const s=Math.min(w.clientWidth, w.clientHeight-20, 400); cv.style.width=s+'px'; cv.style.height=s+'px'; w.style.setProperty('--wr',(s/2)+'px'); }
  function draw(rot){
    const R=340, c=340; ctx.clearRect(0,0,680,680);
    for(let i=0;i<n;i++){
      const a0=rot+i*A-Math.PI/2;
      ctx.beginPath(); ctx.moveTo(c,c); ctx.arc(c,c,R-6,a0,a0+A); ctx.closePath();
      ctx.fillStyle=PAL[i][0]; ctx.fill(); ctx.lineWidth=6; ctx.strokeStyle='#14162B'; ctx.stroke();
      ctx.save(); ctx.translate(c,c); ctx.rotate(a0+A/2); ctx.textAlign='right'; ctx.textBaseline='middle';
      ctx.fillStyle='#14162B'; ctx.font=(n>7?34:42)+'px Jua, "Noto Sans KR", sans-serif'; ctx.fillText(nameOf(i),R-40,0); ctx.restore();
    }
    ctx.beginPath(); ctx.arc(c,c,46,0,Math.PI*2); ctx.fillStyle='#14162B'; ctx.fill(); ctx.lineWidth=6; ctx.strokeStyle='#34375A'; ctx.stroke();
  }
  size(); draw(wRot);
  const onR=()=>{ size(); }; window.addEventListener('resize',onR);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ if(!spinning) draw(wRot); });
  $('#spin').onclick=()=>{
    if(spinning) return; spinning=true; $('#spin').disabled=true; audio();
    const k=Math.floor(Math.random()*n), jit=.15+Math.random()*.7;
    const want=-(k+jit)*A, cur=wRot, TAU=Math.PI*2;
    const delta=TAU*6+(((want-cur)%TAU)+TAU)%TAU;
    const t0=performance.now(), dur=4300; let lastSeg=-1;
    const step=now=>{
      const t=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-t,3);
      wRot=cur+delta*e; draw(wRot);
      const seg=Math.floor(((((-wRot)%TAU)+TAU)%TAU)/A); if(seg!==lastSeg){ lastSeg=seg; beep(900,.03,'square',.03); }
      if(t<1) raf=requestAnimationFrame(step);
      else { spinning=false; fanfare(); buzz([80,60,200]); setTimeout(()=>result({name:nameOf(k), color:PAL[k][0], sub:'돌림판이 골랐어요', n}),900); }
    };
    raf=requestAnimationFrame(step);
  };
  cleanup=()=>{ cancelAnimationFrame(raf); window.removeEventListener('resize',onR); };
}

/* ── 사다리 ── */
function startLadder(){
  show('ladder');
  const n=S.n, LV=10, svg=$('#ladSvg'), top=$('#ladTop'), bot=$('#ladBot');
  let rungs, loser, ends, done, timers=[];
  const cols='repeat('+n+',minmax(0,1fr))'; top.style.gridTemplateColumns=cols; bot.style.gridTemplateColumns=cols;
  function build(){
    timers.forEach(clearTimeout); timers=[];
    rungs=[]; for(let l=0;l<LV;l++){ const row=new Array(n).fill(false); for(let i=0;i<n-1;i++){ if(!(i>0&&row[i-1]) && Math.random()<.5) row[i]=true; } rungs.push(row); }
    for(let i=0;i<n-1;i++){ if(!rungs.some(r=>r[i])){ const l=Math.floor(Math.random()*LV); if(!(i>0&&rungs[l][i-1])&&!rungs[l][i+1]) rungs[l][i]=true; } }
    loser=Math.floor(Math.random()*n); done=new Set();
    ends=[]; for(let s=0;s<n;s++) ends.push(trace(s).end);
    top.innerHTML=''; bot.innerHTML='';
    for(let i=0;i<n;i++){
      const b=document.createElement('button'); b.textContent=nameOf(i); b.style.borderColor=PAL[i][0]; b.onclick=()=>run(i); top.appendChild(b);
      const s=document.createElement('span'); s.textContent='?'; bot.appendChild(s);
    }
    draw();
  }
  function geo(){ const W=svg.clientWidth||320, H=svg.clientHeight||360; const cw=W/n; return {W,H,x:i=>cw*i+cw/2,y:l=>H*(l+1)/(LV+1)}; }
  function trace(s){ let c=s; const g=geo(); const pts=[[g.x(c),0]]; for(let l=0;l<LV;l++){ pts.push([g.x(c),g.y(l)]); if(rungs[l][c]){ c++; pts.push([g.x(c),g.y(l)]); } else if(c>0&&rungs[l][c-1]){ c--; pts.push([g.x(c),g.y(l)]); } } pts.push([g.x(c),g.H]); return {pts,end:c}; }
  function draw(){
    const g=geo(); svg.setAttribute('viewBox','0 0 '+g.W+' '+g.H);
    let h=''; for(let i=0;i<n;i++) h+='<line x1="'+g.x(i)+'" y1="0" x2="'+g.x(i)+'" y2="'+g.H+'" stroke="#34375A" stroke-width="5" stroke-linecap="round"/>';
    rungs.forEach((r,l)=>r.forEach((on,i)=>{ if(on) h+='<line x1="'+g.x(i)+'" y1="'+g.y(l)+'" x2="'+g.x(i+1)+'" y2="'+g.y(l)+'" stroke="#34375A" stroke-width="5" stroke-linecap="round"/>'; }));
    svg.innerHTML=h+'<g id="ladPaths"></g>';
    done.forEach(s=>paint(s,false));
  }
  function paint(s,anim){
    const {pts,end}=trace(s); const d='M'+pts.map(p=>p.join(',')).join(' L');
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',d); p.setAttribute('fill','none'); p.setAttribute('stroke',PAL[s][0]); p.setAttribute('stroke-width','6'); p.setAttribute('stroke-linejoin','round'); p.setAttribute('stroke-linecap','round');
    svg.querySelector('#ladPaths').appendChild(p);
    if(anim){ const L=p.getTotalLength(); p.style.strokeDasharray=L; p.style.strokeDashoffset=L; p.getBoundingClientRect(); p.style.transition='stroke-dashoffset 1.6s linear'; p.style.strokeDashoffset='0'; }
    return end;
  }
  function reveal(end){ const sp=bot.children[end]; if(end===loser){ sp.textContent='독박'; sp.className='lose'; } else { sp.textContent='통과'; sp.className='pass'; } }
  function run(s){
    if(done.has(s)) return; done.add(s); top.children[s].disabled=true; audio(); beep(520,.06,'sine');
    const end=paint(s,true);
    timers.push(setTimeout(()=>{ reveal(end); if(end===loser){ fanfare(); buzz([80,60,200]); top.querySelectorAll('button').forEach(b=>b.disabled=true); timers.push(setTimeout(()=>result({name:nameOf(s), color:PAL[s][0], sub:'사다리 끝에 독박이 있었어요', n}),1100)); } else beep(880,.08,'triangle'); },1650));
  }
  $('#ladNew').onclick=()=>{ build(); beep(600); };
  $('#ladAll').onclick=()=>{ const s=ends.indexOf(loser); if(!done.has(s)) run(s); };
  requestAnimationFrame(build);
  const onR=()=>draw(); window.addEventListener('resize',onR);
  cleanup=()=>{ timers.forEach(clearTimeout); window.removeEventListener('resize',onR); };
}

/* ── 폭탄 돌리기 (폰 1대) ── */
function startBomb(){
  show('bomb');
  const MAXT=40;
  let running=false, passes=0, t0=0, total=0, tick=null, bar=null;
  $('#bBadge').textContent='폰 1대 · '+S.n+'명';
  $('#bPass').textContent='0'; $('#bBar').style.width='0'; $('#bTitle').textContent='준비됐나요?'; $('#bMsg').textContent='시작을 누르고 폭탄을 넘겨요'; $('#bStart').hidden=false;
  const svg=$('#bombSvg');
  function loop(){
    const el=(performance.now()-t0)/1000;
    if(el>=total){ explode(); return; }
    const p=el/total;
    beep(p>.75?1100:880,.04,'square',.05); buzz(30);
    svg.classList.remove('shake'); void svg.getBBox; svg.getBoundingClientRect(); svg.classList.add('shake');
    tick=setTimeout(loop, Math.max(140, 900-760*p));
  }
  function explode(){
    running=false; clearInterval(bar); $('#bBar').style.width='100%';
    boomSound(); buzz([400,80,400]);
    const f=document.createElement('div'); f.className='flash'; f.textContent='펑!'; document.body.appendChild(f);
    setTimeout(()=>{ f.remove(); result({name:'폭탄 든 사람', color:'#FF5C7A', sub:passes+'번 넘긴 끝에 펑!', n:S.n}); },1400);
  }
  $('#bStart').onclick=()=>{
    audio(); running=true; passes=0; t0=performance.now(); total=12+Math.random()*28;
    $('#bStart').hidden=true; $('#bTitle').textContent='째깍째깍…'; $('#bMsg').textContent='화면을 탭하고 옆 사람에게!';
    bar=setInterval(()=>{ const el=(performance.now()-t0)/1000; $('#bBar').style.width=Math.min(96,el/MAXT*100)+'%'; },300);
    loop();
  };
  $('#bombBtn').onclick=()=>{
    if(!running) return; passes++; $('#bPass').textContent=passes;
    const b=$('#bombBtn'); b.classList.remove('bump'); b.getBoundingClientRect(); b.classList.add('bump'); beep(330,.06,'sine',.07);
  };
  cleanup=()=>{ running=false; clearTimeout(tick); clearInterval(bar); $$('.flash').forEach(f=>f.remove()); };
}

/* ── 결과 ── */
function calc(total,n,rule){
  if(n<2) return {l:total,o:0};
  const r100=v=>Math.floor(v/100)*100;
  let o=0;
  if(rule==='double') o=r100(total/(n+1));
  else if(rule==='half') o=r100(total/2/(n-1));
  return {l:total-o*(n-1), o};
}
function renderSplit(){
  const r=S.last; if(!r) return;
  $$('.seg button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.rule===S.rule));
  const box=$('#rSplit');
  if(!S.amount){ box.innerHTML='<div class="mute" style="font-size:13px">금액을 넣으면 '+r.n+'명 기준으로 나눠 드려요</div>'; $('#rNote').hidden=true; return; }
  const {l,o}=calc(S.amount,r.n,S.rule);
  box.innerHTML='<div class="lose"><span>독박 · '+esc(r.name)+'</span><strong>'+won(l)+'</strong></div>'+
    '<div class="rest"><span class="mute">나머지 '+(r.n-1)+'명 · 각자</span><strong>'+won(o)+'</strong></div>';
  $('#rNote').hidden = S.rule==='all';
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function result(r){
  S.last=r; show('result');
  $('#rName').textContent=r.name; $('#rSub').textContent=r.sub;
  const sw=$('#rSwatch'); sw.style.borderColor=r.color; sw.style.background=r.color+'40';
  $('#rAmt').value = S.amount? S.amount.toLocaleString('ko-KR') : '';
  renderSplit();
}
$$('.seg button').forEach(b=>b.onclick=()=>{ S.rule=b.dataset.rule; save(); renderSplit(); });
$('#rHome').onclick=()=>{ show('home'); renderHome(); };
$('#rAgain').onclick=()=>start(S.game);
$('#rShare').onclick=async()=>{
  const r=S.last; let txt='[오늘의 독박] '+r.name+' 당첨! ('+r.sub+')';
  if(S.amount){ const {l,o}=calc(S.amount,r.n,S.rule); txt+='\n전체 '+won(S.amount)+' → 독박 '+won(l)+(o?', 나머지 각 '+won(o):''); }
  try{ if(navigator.share){ await navigator.share({text:txt}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(txt); toast('결과를 복사했어요. 카톡에 붙여 넣으세요'); }
  catch(e){ toast('복사가 막혀 있어요. 화면을 캡처해 주세요'); }
};

load(); renderHome(); show('home');
})();
</script>

<script>
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
