<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>오늘의 독박 · 각자 폰</title>
<meta name="theme-color" content="#14162B">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
:root{--bg:#14162B;--card:#1E2140;--line:#34375A;--deep:#0B0C18;--fg:#F4F2EA;--mute:#B9B8C9;--accent:#FFD447;--red:#FF5C7A;--green:#7CE38B;--blue:#6FD3FF;
  --display:'Jua','Noto Sans KR',system-ui,sans-serif;--body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:440px;margin:0 auto;height:100%;position:relative}
.screen{height:100%;display:flex;flex-direction:column;gap:14px;padding-block:18px;overflow-y:auto}
.disp{font-family:var(--display);font-weight:400}
.mute{color:var(--mute)}
.top{display:flex;align-items:center;gap:10px;flex:none}
.top .disp{font-size:24px;flex:1;min-width:0}
.icon-btn{width:44px;height:44px;flex:none;border-radius:14px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.btn{height:54px;border-radius:16px;border:none;background:var(--accent);color:var(--bg);font-family:var(--display);font-size:20px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;flex:none}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--fg)}
.btn:disabled{opacity:.4;cursor:default}
.btn:active:not(:disabled){transform:scale(.98)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;flex:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--mute);font-weight:700}
.field input{height:52px;border-radius:14px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-size:18px;font-weight:700;outline:none}
.field input:focus{border-color:var(--accent)}
.code-in{letter-spacing:.4em;text-align:center;font-family:var(--display)!important;font-size:30px!important}
.hero{text-align:center;padding:10px 0 4px}
.etitle{font-size:14px;font-weight:900;color:var(--mute);margin:2px 2px 8px}
.egames{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.egames .gcard{min-height:88px}
.gcard .minp{align-self:flex-start;font-size:11px;font-weight:900;color:var(--fg);background:var(--line);border-radius:999px;padding:2px 8px;line-height:1.4}
.capsel button:disabled{opacity:.25}
.capgame{text-align:center;font-size:15px;color:var(--mute)}.capgame b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--accent)}
.hero .big{font-size:34px;color:var(--accent);line-height:1.1}
.hero p{margin:8px 0 0;color:var(--mute);font-size:14px;line-height:1.5}
.badge{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:13px;font-size:12px;font-weight:700;background:var(--bg);border:1px solid var(--line);color:var(--mute)}
.room-head{display:flex;gap:14px;align-items:center}
.qr{width:120px;height:120px;flex:none;background:#fff;border-radius:14px;padding:8px;display:flex;align-items:center;justify-content:center}
.qr img,.qr canvas{width:100%;height:100%;image-rendering:pixelated}
.code{font-family:var(--display);font-size:44px;letter-spacing:.12em;color:var(--accent);line-height:1}
.players{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 8px;border-radius:17px;background:var(--bg);border:1px solid var(--line);font-weight:700;font-size:14px}
.pchip i{width:12px;height:12px;border-radius:50%;flex:none}
.pchip.off{opacity:.4}
.pchip.me{border-color:var(--accent)}
.pchip small{font-size:11px;color:var(--accent);font-weight:700}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gcard{border-radius:18px;border:2px solid var(--line);background:var(--card);padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:96px}
.gcard b{font-family:var(--display);font-weight:400;font-size:21px}
.gcard span{font-size:12px;color:var(--mute);line-height:1.4}
.gcard[aria-pressed="true"]{border-color:var(--accent);background:#2A2B4A}
.gcard[aria-pressed="true"] b{color:var(--accent)}
.gcard{position:relative}.gcard .rec{align-self:flex-start;font-size:11px;font-weight:900;color:var(--bg);background:var(--accent);border-radius:999px;padding:2px 8px;line-height:1.4}
.gcard.dim{opacity:.4}
.gcard .q{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);color:var(--mute);font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;z-index:2}
.gcard .rec.ghost{visibility:hidden}
.ver{text-align:center;font-size:11px;color:var(--mute);opacity:.6;flex:none}.gcard .need{color:var(--red);font-weight:900}
.recline{font-size:14px;color:var(--mute);text-align:center;line-height:1.5;min-height:42px}.recline b{color:var(--accent)}
.pbar{display:flex;align-items:center;gap:8px;height:26px;font-size:13px;font-weight:700}.pbar .nm{width:72px;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.pbar .nm i{flex:none;width:10px;height:10px;border-radius:50%}
.pbar .tr{flex:1;height:10px;border-radius:6px;background:var(--card);overflow:hidden}.pbar .tr b{display:block;height:100%;border-radius:6px;transition:width .15s}.pbar .ct{width:28px;text-align:right;font-family:var(--display);font-size:16px}
.grid25{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(100%,380px);margin:0 auto}
.grid25 button{aspect-ratio:1;border-radius:12px;border:2px solid var(--line);background:var(--card);font-family:var(--display);font-size:26px;color:var(--fg);touch-action:manipulation;transition:background .1s}
.grid25 button.done{background:transparent;border-color:transparent;color:transparent}
.grid25 button.bad{animation:bad .35s}@keyframes bad{0%,100%{transform:none;background:var(--card)}30%{transform:translateX(-4px);background:var(--red)}60%{transform:translateX(4px)}}
.pchip .lz{font-size:11px;color:var(--red);font-weight:900;margin-left:2px}
.duel{transition:background .05s}
.ccv{width:100%;aspect-ratio:600/500;border-radius:16px;display:block;touch-action:none}
.cctl{display:flex;flex-direction:column;gap:8px}.crow{display:flex;gap:8px;align-items:center}.cab{flex:1;height:52px;font-size:22px}
.cang{flex:1.2;text-align:center;font-family:var(--display);font-size:28px;color:var(--accent)}
.cpow{position:relative;height:14px;border-radius:8px;background:var(--card);border:1px solid var(--line);overflow:hidden}.cpow b{display:block;height:100%;background:linear-gradient(90deg,#7CE38B,#FFD447,#FF5C7A)}.cpow i{position:absolute;top:0;bottom:0;width:3px;background:#fff;margin-left:-1px}
.cfire{height:60px;font-size:18px;touch-action:none;user-select:none;-webkit-user-select:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--bg);color:var(--mute);font-weight:700;font-size:13px}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.rules{font-size:14px;line-height:1.7;color:var(--mute)}
.capsel{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.capsel button{height:54px;border-radius:14px;border:2px solid var(--line);background:var(--bg);font-family:var(--display);font-size:24px}
.capsel button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--bg)}
.pchip.empty{border-style:dashed;color:var(--mute);font-weight:400}
.pchip button{border:none;background:none;color:var(--mute);font-size:15px;padding:0 0 0 2px;line-height:1}
.full{color:var(--green)!important}
.howto{align-self:flex-start;height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-weight:700;font-size:13px}
.lbar{position:sticky;bottom:-18px;margin-bottom:-18px;padding:10px 0 18px;background:linear-gradient(to bottom,rgba(20,22,43,0),var(--bg) 26%);display:flex;flex-direction:column;gap:6px;flex:none;z-index:5}
.fullgame{font-family:var(--display);font-size:30px;color:var(--accent);text-align:center}
.pop{position:fixed;inset:0;z-index:50;background:rgba(5,6,14,.72);display:flex;align-items:center;justify-content:center;padding:20px}
.pop-in{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;animation:pop .2s ease-out}
.rules b{color:var(--fg)}
.wait{text-align:center;color:var(--mute);font-size:14px;padding:6px 0}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;align-items:stretch;justify-content:center}
.count{font-family:var(--display);font-size:110px;line-height:1;text-align:center;color:var(--accent)}
.bigbtn{flex:none;width:min(240px,62vw);aspect-ratio:1;border-radius:50%;border:none;margin:0 auto;background:radial-gradient(circle at 35% 30%,#FFE58A,var(--accent) 55%,#C99A00);color:var(--bg);font-family:var(--display);font-size:46px;box-shadow:0 10px 0 #8A6A00,0 18px 30px rgba(0,0,0,.4);transition:transform .08s,box-shadow .08s}
.bigbtn:active:not(:disabled){transform:translateY(8px);box-shadow:0 2px 0 #8A6A00,0 6px 12px rgba(0,0,0,.4)}
.bigbtn:disabled{filter:grayscale(.7) brightness(.7)}
.arena{flex:1;min-height:240px;position:relative;border-radius:22px;background:radial-gradient(circle at 50% 40%,#22264A,var(--deep) 75%);border:1px dashed var(--line);overflow:hidden}
.arena .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mute);font-size:14px;padding:20px;pointer-events:none}
.dotbtn{position:absolute;width:64px;height:64px;border-radius:50%;border:none;background:radial-gradient(circle at 35% 30%,#FFE58A,var(--accent) 60%,#C99A00);color:var(--bg);font-family:var(--display);font-size:28px;box-shadow:0 5px 0 #8A6A00,0 8px 16px rgba(0,0,0,.45);animation:pop .25s ease-out;touch-action:none}
.dotbtn:disabled{filter:grayscale(.6) brightness(.75)}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.mine{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.mine b{font-family:var(--display);font-weight:400;font-size:72px;color:var(--accent);line-height:1}
.calls.sm{max-height:24vh}
.calls{display:flex;flex-direction:column;gap:6px;max-height:34vh;overflow:auto}
.call{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700}
.call .n{font-family:var(--display);font-size:22px;width:30px;color:var(--accent)}
.call i{width:12px;height:12px;border-radius:50%}
.call.bad{border-color:var(--red);background:#3A1E33}
.call.bad .n{color:var(--red)}
.hold{flex:none;height:200px;border-radius:22px;border:2px dashed var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:16px;touch-action:none}
.hold.on{border-style:solid;border-color:var(--accent);background:#2A2B4A}
.hold .w{font-family:var(--display);font-size:40px;color:var(--fg);line-height:1.15}
.hold .liar{color:var(--red)}
.hold small{color:var(--mute);font-size:13px}
.vote{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.vote button{height:56px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.vote button i{width:12px;height:12px;border-radius:50%}
.vote button[aria-pressed="true"]{border-color:var(--accent);background:#2A2B4A}
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.result .who{font-family:var(--display);font-size:40px;line-height:1.15}
.result .who em{font-style:normal;color:var(--red)}
.result .why{color:var(--mute);font-size:14px;line-height:1.5}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-1px;margin-right:4px}
.timer{font-family:var(--display);font-size:42px;text-align:center;color:var(--accent);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}
.status{font-size:12px;color:var(--mute);text-align:center}
.status.err{color:var(--red)}
.status:empty{display:none}
.mename{align-self:flex-start;display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:16px;flex:none}.mename b{font-weight:900}.mename .pen{font-size:13px;opacity:.7}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.flash{animation:fl .5s ease-out}
@keyframes fl{from{transform:scale(1.15)}}
</style>
</head>
<body>
<div class="app">

<!-- 입장 -->
<section class="screen" id="sEntry">
  <div class="top"><button class="icon-btn" id="eBack" aria-label="뒤로"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><div class="disp" id="tEntry">각자 폰</div></div>
  <div class="hero" id="hero" hidden><div class="disp big" id="tHero">각자 폰으로 함께!</div><p id="tHeroSub">한 명이 방을 만들고, 나머지는 QR을 찍거나<br>방 번호를 넣어서 들어와요</p></div>
  <button class="mename" id="meRow" hidden><span>👤</span><b id="meName"></b><span class="pen">✏️</span></button>
  <div class="status" id="netStatus"></div>
  <div id="joinBox" class="card field" hidden><label for="codeIn" id="tCode">방 번호</label><input id="codeIn" class="code-in" inputmode="numeric" maxlength="4" pattern="[0-9]*"></div>
  <div id="eGamesWrap"><div class="etitle" id="tPick">어떤 게임 할까요?</div><div class="egames" id="eGames"></div></div>
  <div style="flex:1"></div>
  <div class="lbar">
  <button class="btn" id="bCreate">방 만들기</button>
  <button class="btn ghost" id="bJoin">방 번호로 참여</button>
  <div class="ver">v7</div></div>
</section>

<!-- 대기실 -->
<section class="screen" id="sLobby" hidden>
  <div class="top"><button class="icon-btn" id="lBack" aria-label="나가기"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><div class="disp" id="tLobby">대기실</div><span class="badge" id="pCount">0명</span></div>
  <div class="card room-head"><div class="qr" id="qr" aria-label="참여 QR 코드"></div><div style="min-width:0"><div class="mute" style="font-size:13px;font-weight:700" id="tRoomNo">방 번호</div><div class="code" id="codeOut">----</div><div class="mute" style="font-size:12px;margin-top:6px;line-height:1.45" id="tScan">카메라로 QR을 찍으면<br>바로 들어와요</div></div></div>
  <div class="players" id="players"></div>
  <div class="games" id="gPick"></div>
  <div class="card" id="liarOpt" hidden><div class="mute" style="font-size:13px;font-weight:700;margin-bottom:8px" id="tTopic">주제</div><div class="chips" id="cats"></div></div>
  <button class="howto" id="bHow" hidden>❔ <span id="tHow">게임 방법</span></button>
  <div style="flex:1"></div>
  <div class="lbar"><div class="wait" id="lWait"></div><button class="btn" id="bStart">시작</button></div>
</section>

<!-- 게임 -->
<section class="screen" id="sGame" hidden>
  <div class="top"><button class="icon-btn" id="gBack" aria-label="대기실로"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><div class="disp" id="gTitle">게임</div><span class="badge" id="gCode"></span></div>
  <div class="stage" id="stage"></div>
  <div id="gBtns" class="row2" hidden><button class="btn ghost" id="bLobby">다른 게임</button><button class="btn" id="bAgain">한 판 더</button></div>
</section>

</div>
<div class="toast" id="toast" hidden></div>
<div class="pop" id="capPop" hidden><div class="pop-in"><div class="disp" style="font-size:24px" id="capTitle">몇 명 방을 만들까요?</div><div class="capgame" id="capGame"></div><div class="capsel" id="capSel"></div><div class="recline" id="capRec" hidden></div><div class="row2"><button class="btn ghost" id="capNo">취소</button><button class="btn" id="capOk">만들기</button></div></div></div>
<div class="pop" id="fullPop" hidden><div class="pop-in" style="text-align:center"><div style="font-size:44px">🎉</div><div class="disp" style="font-size:26px" id="fullTitle">다 모였어요!</div><div class="fullgame" id="fullGame"></div><div class="row2"><button class="btn ghost" id="fullNo">다른 게임</button><button class="btn" id="fullGo">시작</button></div></div></div>
<div class="pop" id="askPop" hidden style="z-index:60"><div class="pop-in" style="text-align:center"><div style="font-size:18px;font-weight:700;line-height:1.5;padding:6px 0" id="askMsg"></div><div class="row2"><button class="btn ghost" id="askNo">취소</button><button class="btn" id="askOk">확인</button></div></div></div>
<div class="pop" id="namePop" hidden><div class="pop-in"><div class="disp" style="font-size:24px" id="tName">내 이름</div><div class="field"><input id="nameIn" maxlength="8" autocomplete="nickname"></div><div class="mute" style="font-size:13px;margin-top:-6px" id="tNameSub">방에서 친구들에게 보이는 이름이에요</div><div class="row2"><button class="btn ghost" id="nameNo">취소</button><button class="btn" id="nameOk">확인</button></div></div></div>
<div class="pop" id="howPop" hidden><div class="pop-in"><div class="disp" style="font-size:24px" id="howTitle"></div><div class="rules" id="rules"></div><button class="btn" id="howOk">확인</button></div></div>

<script>//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);

  const fire=()=>{ const o=read(); subs.forEach(s=>{ const v=JSON.stringify(getAt(o,s.p)??null); if(v!==s.last){ s.last=v; s.cb(JSON.parse(v)); } }); };
  window.addEventListener('storage',e=>{ if(e.key===K) fire(); });
  return { TS:{__ts:1}, now:()=>Date.now(),
    get:async p=>getAt(read(),p)??null, set:async(p,v)=>write(o=>setAt(o,p,v)),
    update:async(p,v)=>write(o=>{ for(const k in v) setAt(o,p+'/'+k,v[k]); }), remove:async p=>write(o=>setAt(o,p,null)),
    on:(p,cb)=>{ const s={p,cb,last:undefined}; subs.add(s); setTimeout(fire,0); return ()=>subs.delete(s); },
    onDisc:async()=>{}, cancelDisc:async()=>{} };
}

async function sweepOld(keep){ try{ const idx=await Net.get('roomIdx')||{}, lim=Net.now()-6*3600e3;
  for(const c of Object.keys(idx)){ if(c===keep||!(idx[c]<lim)) continue;
    try{ await Net.remove('secrets/'+c); }catch(e){} try{ await Net.remove('rooms/'+c); }catch(e){} try{ await Net.remove('roomIdx/'+c); }catch(e){} } }catch(e){} }

async function enter(c){

  try{ history.replaceState(null,'',location.pathname+'?'+(IN_APP?'app=1&':'')+(MOCK?'mock=1&':'')+'lang='+LANG+'&r='+c); }catch(e){}
  unsub.forEach(f=>f()); unsub=[];
  unsub.push(Net.on('rooms/'+c,r=>{ const was=room; room=r;
    if(!r||!r.host){ if(was){ toast(T('방이 닫혔어요','The room was closed')); } leaveLocal(); return; }
    if(r.players&&r.players[uid]&&r.players[uid].on===false) Net.set('rooms/'+c+'/players/'+uid+'/on',true);

  h+='<div class="calls sm">'+calls.map((c,i)=>'<div class="call'+(badSet.has(c.id)?' bad':'')+'"><span class="n">'+(i+1)+'</span><i style="background:'+colorOf(c.id)+'"></i>'+esc(nameOf(c.id))+(c.id===uid?' ('+T('나','me')+')':'')+'</div>').join('')+'</div>';

function judgeNunchi(st){ // 방장만
  const calls=nunchiCalls(st), now=Net.now(), ids=st.ids||[];
  for(let i=0;i<calls.length;i++){ const grp=[calls[i]]; while(i+1<calls.length&&calls[i+1].t-calls[i].t<GAP){ i++; grp.push(calls[i]); }
    if(grp.length>1) return {losers:grp.map(c=>c.id),why:'same'}; }
  const last=calls.length?calls[calls.length-1].t:st.startAt;
  if(calls.length>=ids.length-1&&now-last>GAP+300){ const left=ids.filter(id=>!calls.some(c=>c.id===id)); if(left.length) return {losers:left,why:'last'}; }
  if(now-st.startAt>NUNCHI_LIMIT){ const left=ids.filter(id=>!calls.some(c=>c.id===id)); if(left.length) return {losers:left,why:'last'}; }
  return null;
}

async function countVotes(st,force){ // 방장만

    x.fillStyle=c; x.beginPath(); x.arc(tx,ty,15*s,Math.PI,0); x.fill(); x.fillRect(tx-19*s,ty,38*s,8*s);
    x.font='bold '+Math.round(24*s)+'px sans-serif'; x.textAlign='center'; x.fillStyle='#fff'; x.fillText(nameOf(id).slice(0,5)+(id===sh&&!A?' ▼':''),tx,ty-26*s); x.globalAlpha=1;
    if(landed&&dmg[id]&&el-st.shot.T<1.6){ x.fillStyle='#FF5C7A'; x.font='bold '+Math.round(34*s)+'px sans-serif'; x.fillText('-'+dmg[id],tx,ty-52*s-(el-st.shot.T)*20*s); } }
  if(A){ const n=Math.min(A.pts.length,Math.floor(el*60)+1); x.strokeStyle='rgba(255,255,255,.35)'; x.lineWidth=2*s; x.beginPath(); for(let i=0;i<n;i++){ const p=A.pts[i]; i?x.lineTo(X(p[0]),Y(p[1])):x.moveTo(X(p[0]),Y(p[1])); } x.stroke();
    if(flying){ const p=A.pts[n-1]; x.fillStyle='#FFD447'; x.beginPath(); x.arc(X(p[0]),Y(p[1]),6*s,0,7); x.fill(); }
    else if(!st.shot.miss){ const b=(performance.now()-A.boom)/1000; if(b<.6){ x.fillStyle='rgba(255,140,40,'+(1-b/.6)+')'; x.beginPath(); x.arc(X(st.shot.ix),Y(st.shot.iy),(10+b*60)*s,0,7); x.fill(); } } }
  // 바람
  const wd=st.wind||0; x.fillStyle='#fff'; x.font='bold '+Math.round(28*s)+'px sans-serif'; x.textAlign='center'; x.fillText(T('바람','Wind')+' '+(wd<0?'◀'.repeat(Math.min(3,Math.ceil(-wd/2)))+' '+(-wd):wd>0?wd+' '+'▶'.repeat(Math.min(3,Math.ceil(wd/2))):'0'),X(CW/2),40*s);
  if(now<st.startAt){ x.fillStyle='rgba(0,0,0,.45)'; x.fillRect(0,0,cv.width,cv.height); x.fillStyle='#FFD447'; x.font=Math.round(110*s)+'px Jua,sans-serif'; x.fillText(Math.ceil((st.startAt-now)/1000),X(CW/2),Y(CH/2)+40*s); }
  // 글자
  const info=$('#cInfo'), left=Math.max(0,Math.ceil(((st.turnStart||st.startAt)+CTURN-now)/1000));
  const it=A?(flying?'💨 '+T('발사!','Fire!'):st.shot.miss?T('🙈 빗나갔어요','🙈 Missed'):st.shot.hit?T('🎯 직격!','🎯 Direct hit!'):'💥'):now<st.startAt?T('곧 시작해요','Starting soon'):(sh===uid?'<b style="color:var(--accent)">'+T('내 차례!','Your turn!')+'</b>':'<b>'+esc(nameOf(sh))+'</b> '+T('차례','\'s turn'))+' · ⏱ '+left+' · '+T('턴','Turn')+' '+((st.turns||0)+1)+'/'+st.limit;
  if(info.innerHTML!==it) info.innerHTML=it;
  const hp=arr(st.order).map(id=>{ const k=st.tanks[id]||{}, v=Math.max(0,k.hp-(dmg[id]||0)); return '<div class="pbar"><span class="nm"><i style="background:'+colorOf(id)+'"></i>'+(id===sh?'▶':'')+esc(nameOf(id))+'</span><span class="tr"><b style="width:'+v+'%;background:'+(v>30?colorOf(id):'var(--red)')+'"></b></span><span class="ct">'+v+'</span></div>'; }).join('');
  const hb=$('#cHp'); if(hb.innerHTML!==hp) hb.innerHTML=hp;
  const ctl=$('#cCtl'), show=mine&&!st.shot&&L.fired!==st.seq&&now>=st.startAt; if(ctl.hidden===show){ ctl.hidden=!show; if(show){ buzz([30,40,30]); beep(880,.08); } }
  if(show){ const ang=$('#cAng'), at=cDir(L.a)+' '+cElev(L.a)+'°'; if(ang.textContent!==at) ang.textContent=at;
    if(L.cs!=null){ const t=((performance.now()-L.cs)/1300)%2; L.pw=t<1?t:2-t; } $('#cPw').style.width=((L.cs!=null?L.pw:0)*100)+'%';
    const ls=$('#cLast'); ls.hidden=L.lastP==null; if(L.lastP!=null) ls.style.left=(L.lastP*100)+'%'; }
}
async function hostCannon(st){ const now=Net.now(); if(now<st.startAt) return; const sh=cShooter(st), a=room.acts||{};
  if(!st.shot){ const act=a[sh];
    if(act&&act.r===st.round&&act.seq===st.seq){ const r=cSim(st,sh,act.a,act.p), dmg=cDamage(st,r);
      const tanks=JSON.parse(JSON.stringify(st.tanks)); tanks[sh].a=act.a;
      await Net.update('rooms/'+code+'/state',{tanks,shot:{seq:st.seq,by:sh,a:act.a,p:act.p,T:Math.round(r.T*1000)/1000,ix:Math.round(r.ix*10)/10,iy:Math.round(r.iy*10)/10,miss:r.miss,hit:r.hit||'',dmg},nextAt:now+r.T*1000+1700}); return; }
    if(now>(st.turnStart||st.startAt)+CTURN) await cAdvance(st,st.tanks,arr(st.craters));
    return; }
  if(now>=st.nextAt){ const tanks=JSON.parse(JSON.stringify(st.tanks)), d=st.shot.dmg||{}; for(const id in d) if(tanks[id]) tanks[id].hp=Math.max(0,tanks[id].hp-d[id]);
    const cr=arr(st.craters).slice(); if(!st.shot.miss) cr.push({x:st.shot.ix,y:st.shot.iy,r:CCRATER});
    await cAdvance(st,tanks,cr); } }
async function cAdvance(st,tanks,craters){ const order=arr(st.order), dead=order.filter(id=>tanks[id]&&tanks[id].hp<=0), turns=(st.turns||0)+1;
  if(dead.length){ await Net.update('rooms/'+code+'/state',{tanks,craters,shot:null}); await setResult({losers:dead,why:'dead'}); return; }
  if(turns>=st.limit){ const mn=Math.min(...order.map(id=>tanks[id].hp)), L=order.filter(id=>tanks[id].hp===mn); const hs=order.map(id=>tanks[id].hp).sort((a,b)=>a-b), nx=hs.find(v=>v>mn);
    await Net.update('rooms/'+code+'/state',{tanks,craters,shot:null}); await setResult({losers:L,why:'hp',margin:L.length===1&&nx!=null?T('체력 '+(nx-mn)+' 차이','Lost by '+(nx-mn)+' HP'):''}); return; }
  let t=st.turn||0; for(let k=0;k<order.length;k++){ t=(t+1)%order.length; if(tanks[order[t]].hp>0&&online().some(p=>p.id===order[t])) break; }
  await Net.update('rooms/'+code+'/state',{tanks,craters,shot:null,turn:t,turns,seq:(st.seq||0)+1,wind:rnd(13)-6,turnStart:Net.now()}); }

/* ===== 방장 진행 ===== */
async function startGame(){
  if(!isHost()) return; const st=room.state||{}, g=GAMES[st.game]||GAMES.nunchi, ids=online().map(p=>p.id), round=(st.round||0)+1;
  if(ids.length<g.min) return; beep(880,.1);
  if(st.game==='liar'){
    const W=EN?WORDS_EN:WORDS_KO, cats=Object.keys(W), cat=(st.cat&&W[st.cat])?st.cat:cats[rnd(cats.length)], word=W[cat][rnd(W[cat].length)], liar=ids[rnd(ids.length)];
    const sec={_h:{liar,word,cat}}; ids.forEach(id=>sec[id]=id===liar?{role:'liar'}:{role:'cit',word});
    await Net.set('secrets/'+code,sec);
    await Net.update('rooms/'+code,{acts:null,state:{phase:'game',game:'liar',cat:st.cat||'rand',catName:cat,round,ids,order:shuffle(ids),step:'reveal'}});
  } else await startRound(st.game in GAMES?st.game:'nunchi',ids,0,round);
}
function startRound(game,ids,final,round,extra){ const st=room.state||{}, now=Net.now(), s=Object.assign({phase:'game',game,cat:st.cat||'rand',round,ids,startAt:now+3500,final},extra||{});
  if(game==='draw') s.fireAt=s.startAt+1500+rnd(3500);
  if(game==='cannon') Object.assign(s,cannonInit(ids),{turnStart:s.startAt});
  if(game==='race') s.board=shuffle(Array.from({length:25},(_,i)=>i+1));
  return Net.update('rooms/'+code,{acts:null,state:s}); }
function hostTick(){
  if(!isHost()){ clearInterval(hostTimer); hostTimer=null; return; }
  if(!hostTimer) hostTimer=setInterval(hostStep,250);
  hostStep();
}
let judging=false;
async function hostStep(){
  if(!room||!isHost()||judging) return; const st=room.state||{}; if(st.phase!=='game') return;
  if(st.result){ // 눈치게임: 2명 이상 걸리면 그 사람들끼리 결승
    const L=arr(st.result.losers);
    if(st.game!=='liar'&&L.length>1&&st.result.nextAt&&Net.now()>=st.result.nextAt){ judging=true;
      try{ await startRound(st.game,L,(st.final||0)+1,(st.round||0)+1); }catch(e){}
      judging=false; }
    return; }
  judging=true;
  try{
    const J={nunchi:judgeNunchi,timer:judgeTimer,draw:judgeDuel,race:judgeRace}[st.game];
    if(st.game==='cannon') await hostCannon(st);
    else if(J){ const r=J(st); if(r&&r.restart) await startRound(st.game,arr(st.ids),st.final||0,(st.round||0)+1,{warn:r.warn,fsIds:r.fsIds}); else if(r) await setResult(r); }
    else if(st.game==='liar'){
      if(st.step==='vote') await countVotes(st,false);
      else if(st.step==='guess') await checkGuess(st);
    }
  }catch(e){ console.error(e); }
  judging=false;
}
$('#bStart').onclick=startGame;
$('#fullGo').onclick=()=>{ $('#fullPop').hidden=true; startGame(); };
$('#fullNo').onclick=()=>{ $('#fullPop').hidden=true; $('#gPick').scrollIntoView({behavior:'smooth',block:'start'}); };

function showHow(k){ const g=GAMES[k]; if(!g) return; $('#rules').innerHTML=g.rules(); $('#howTitle').textContent=EN?g.en:g.ko; $('#howOk').textContent=T('확인','OK'); $('#howPop').hidden=false; beep(700,.04); }
$('#bHow').onclick=()=>showHow((room&&room.state&&room.state.game)||'nunchi');
$('#howOk').onclick=()=>{ $('#howPop').hidden=true; };
$('#howPop').onclick=e=>{ if(e.target.id==='howPop') $('#howPop').hidden=true; };
$('#bAgain').onclick=startGame;
$('#bLobby').onclick=()=>{ if(isHost()) Net.update('rooms/'+code,{acts:null,state:Object.assign({},room.state,{phase:'lobby',result:null,step:null})}); };
$('#gBack').onclick=()=>{ if(isHost()) $('#bLobby').onclick(); else toast(T('방장이 게임을 끝내면 대기실로 돌아가요','The host will bring everyone back to the lobby')); };

/* ===== 뒤로 ===== */
function goHome(){ if(IN_APP&&history.length>1) history.back(); else location.href=IN_APP?'about:blank':'./'; }
$('#eBack').onclick=goHome;
$('#lBack').onclick=()=>{ confirmLeave().then(ok=>{ if(ok) leaveRoom(); }); };
function confirmLeave(){ if(!isHost()||online().length<=1) return Promise.resolve(true); return ask(T('방장이 나가면 방이 닫혀요. 나갈까요?','If the host leaves, the room closes. Leave?'),T('나가기','Leave')); }
// 앱(WebView)에서는 confirm()이 안 떠서 직접 만든 확인창을 써요
function ask(msg,okTxt){ return new Promise(res=>{ $('#askMsg').textContent=msg; $('#askOk').textContent=okTxt||T('확인','OK'); $('#askNo').textContent=T('취소','Cancel'); $('#askPop').hidden=false;
  const done=v=>{ $('#askPop').hidden=true; $('#askOk').onclick=$('#askNo').onclick=$('#askPop').onclick=null; res(v); };
  $('#askOk').onclick=()=>done(true); $('#askNo').onclick=()=>done(false); $('#askPop').onclick=e=>{ if(e.target.id==='askPop') done(false); }; }); }
window.appBack=function(){ // 안드로이드 뒤로가기
  if(!$('#askPop').hidden){ $('#askNo').onclick(); return 'ok'; }
  if(!$('#namePop').hidden){ $('#nameNo').onclick(); return 'ok'; }
  if(!$('#fullPop').hidden){ $('#fullPop').hidden=true; return 'ok'; }
  if(!$('#howPop').hidden){ $('#howPop').hidden=true; return 'ok'; }
  if(!$('#capPop').hidden){ $('#capPop').hidden=true; return 'ok'; }
  if(!$('#sGame').hidden){ $('#gBack').onclick(); return 'ok'; }
  if(!$('#sLobby').hidden){ $('#lBack').onclick(); return 'ok'; }
  if(IN_APP&&history.length>1){ history.back(); return 'ok'; }
  return 'exit';
};

/* ===== 시작 ===== */
applyText();
showMe();
function joinMode(on){ $('#joinBox').hidden=!on; $('#eGamesWrap').hidden=on; $('#bCreate').classList.toggle('ghost',on); $('#bJoin').classList.toggle('ghost',!on); $('#bJoin').textContent=on?T('참여하기','Join'):T('방 번호로 참여','Join with number'); if(on) $('#bCreate').textContent=T('방 만들기','Create room'); else drawEntryGames(); }
$('#bCreate').onclick=()=>{ if(!$('#joinBox').hidden&&!Q.get('r')){ joinMode(false); return; } askCap(); }; $('#capOk').onclick=createRoom; $('#capNo').onclick=()=>$('#capPop').hidden=true; $('#capPop').onclick=e=>{ if(e.target.id==='capPop') $('#capPop').hidden=true; }; $('#bJoin').onclick=joinRoom;
$('#codeIn').addEventListener('input',e=>{ e.target.value=e.target.value.replace(/\D/g,'').slice(0,4); });
$('#codeIn').addEventListener('keydown',e=>{ if(e.key==='Enter') joinRoom(); });

drawEntryGames();
if(qr.length===4){ $('#hero').hidden=false; $('#eGamesWrap').hidden=true; $('#joinBox').hidden=false; $('#codeIn').value=qr; $('#bJoin').textContent=T(qr+'번 방에 참여','Join room '+qr); $('#bCreate').hidden=true; $('#bJoin').classList.remove('ghost'); if(!myName) setTimeout(()=>openName(),300); }
ensureNet().catch(()=>{});
})();
