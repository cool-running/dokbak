.status.err{color:var(--red)}
.status:empty{display:none}
.mename{margin-left:auto;max-width:50%;overflow:hidden;display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:16px;flex:none}.mename b{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mename .pen{font-size:13px;opacity:.7}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.flash{animation:fl .5s ease-out}
@keyframes fl{from{transform:scale(1.15)}}
.solo-btn{display:block;margin:8px auto 0;background:none;border:0;color:var(--accent);font:700 14px var(--body,sans-serif);padding:6px 10px;text-decoration:underline;text-underline-offset:3px}
</style>
</head>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

        var b0 = bin.read();

        var b2 = read();

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

const eun=w=>{ const c=w.charCodeAt(w.length-1)-0xAC00; return (c>=0&&c<11172&&c%28)?'은':'는'; };
const mpText=G=>G.max===G.min?T(G.min+'명 전용',G.min+' only'):T(G.min+'명부터',G.min+'+ players');
const gIcon=k=>{ const i=ICON[k]; return i?'<svg class="gi" viewBox="0 0 24 24" fill="none" stroke="'+i[0]+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+i[1]+'</svg>':''; };
let pickGame=(()=>{ try{ return localStorage.getItem('dokbakPick')||ORDER[0]; }catch(e){ return ORDER[0]; } })();
const ro=w=>{ const c=w.charCodeAt(w.length-1)-0xAC00; return (c>=0&&c<11172&&c%28&&c%28!==8)?'으로':'로'; };
function drawEntryGames(){ if(!ORDER.includes(pickGame)) pickGame=ORDER[0]; const box=$('#eGames'), PER=12, pages=Math.ceil(ORDER.length/PER);
  const card=k=>{ const G=GAMES[k]; return '<button class="gcard" data-g="'+k+'" aria-pressed="'+(k===pickGame)+'"><span class="q" data-q="'+k+'" role="button" aria-label="'+T('게임 방법','How to play')+'">?</span><span class="minp'+(G.max===G.min?' only':G.min>2?' more':'')+'">'+(G.max===G.min?T(G.min+'인',G.min+' only'):G.min+'+')+'</span>'+gIcon(k)+'<span class="gt"><b>'+(EN?G.en:G.ko)+'</b></span></button>'; };
  if(!box.dataset.built){ box.dataset.built=1;
    box.innerHTML=Array.from({length:pages},(_,p)=>'<div class="egames">'+ORDER.slice(p*PER,(p+1)*PER).map(card).join('')+'</div>').join('');
    box.onclick=e=>{ const q=e.target.closest('[data-q]'); if(q){ showHow(q.dataset.q); return; } const b=e.target.closest('.gcard'); if(!b) return; pickGame=b.dataset.g; try{ localStorage.setItem('dokbakPick',pickGame); }catch(_){} beep(700,.05); drawEntryGames(); };
    const dots=$('#eDots'); dots.innerHTML=pages>1?Array.from({length:pages},(_,k)=>'<i class="'+(k?'':'on')+'"></i>').join(''):'';
    const cur=()=>Math.round(box.scrollLeft/Math.max(1,box.clientWidth)), go=k=>box.scrollTo({left:Math.max(0,Math.min(pages-1,k))*box.clientWidth,behavior:'smooth'});
    box.addEventListener('scroll',()=>{ const k=cur(); [...dots.children].forEach((d,j)=>d.classList.toggle('on',j===k)); },{passive:true});
    [...dots.children].forEach((d,k)=>d.onclick=()=>go(k));
    let wl=0; box.addEventListener('wheel',e=>{ if(pages<2||Math.abs(e.deltaY)<Math.abs(e.deltaX)) return; e.preventDefault(); const t=Date.now(); if(t-wl<450) return; wl=t; go(cur()+(e.deltaY>0?1:-1)); },{passive:false});
    let dx=null; box.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse') dx=e.clientX; }); window.addEventListener('pointerup',e=>{ if(dx==null) return; const d=e.clientX-dx; dx=null; if(Math.abs(d)>40) go(cur()+(d<0?1:-1)); });
  }
  box.querySelectorAll('.gcard').forEach(b=>b.setAttribute('aria-pressed',b.dataset.g===pickGame)); }
function askCap(){ if(!needName(askCap)) return; if(!ORDER.includes(pickGame)) pickGame=ORDER[0]; const box=$('#capSel'), G=GAMES[pickGame], mn=G.min; if(capPick<mn) capPick=mn;
  if(G.max&&capPick>G.max) capPick=G.max;
  $('#capGame').innerHTML='<b>'+esc(EN?G.en:G.ko)+'</b> · '+mpText(G);
  box.innerHTML=[2,3,4,5,6,7,8,9,10].map(n=>'<button data-n="'+n+'" aria-pressed="'+(n===capPick)+'"'+(n<mn?' disabled':'')+'>'+n+'</button>').join('');
  const rl=()=>$('#capRec').innerHTML=recText(capPick); rl();
  [...box.children].forEach(b=>{ if(G.max&&+b.dataset.n>G.max) b.classList.add('over'); });
  [...box.children].forEach(b=>b.onclick=()=>{ if(G.max&&+b.dataset.n>G.max){ toast(T(G.ko+eun(G.ko)+' '+G.max+'명 전용 게임이에요',G.en+' is for '+G.max+' players only')); buzz(40); return; } capPick=+b.dataset.n; [...box.children].forEach(x=>x.setAttribute('aria-pressed',x===b)); beep(700,.04); rl(); }); $('#capPop').hidden=false; }
async function createRoom(){
  $('#capPop').hidden=true; if(!needName()) return; $('#bCreate').disabled=true;
  try{ await ensureNet();
    let c=null; for(let k=0;k<12;k++){ const t=String(1000+rnd(9000)); const r=await Net.get('rooms/'+t); if(!r||!r.created||r.created<Net.now()-6*3600e3){ c=t; break; } }
    if(!c) throw new Error('no code');
    await Net.set('rooms/'+c,{host:uid,created:Net.TS,cap:capPick,state:{phase:'lobby',game:pickGame,cat:'rand',round:0},players:{[uid]:{name:myName,joined:Net.TS,on:true}}});
    await Net.set('roomIdx/'+c,Net.TS).catch(()=>{});
    await enter(c);
    sweepOld(c);
  }catch(e){ console.error(e); if(Net) toast(T('방을 만들지 못했어요','Could not create the room')); }
  $('#bCreate').disabled=false;
}
// 6시간 넘은 방은 새 방을 만드는 사람이 대신 지워요 (서버 자동 청소)
async function sweepOld(keep){ try{ const idx=await Net.get('roomIdx')||{}, lim=Net.now()-6*3600e3;
  for(const c of Object.keys(idx)){ if(c===keep||!(idx[c]<lim)) continue;
    try{ await Net.remove('secrets/'+c); }catch(e){} try{ await Net.remove('rooms/'+c); }catch(e){} try{ await Net.remove('roomIdx/'+c); }catch(e){} } }catch(e){} }
async function joinRoom(){
  if($('#joinBox').hidden){ joinMode(true); $('#codeIn').focus(); return; }
  if(!needName(joinRoom)) return; const c=$('#codeIn').value.replace(/\D/g,'');
  if(c.length!==4){ toast(T('방 번호 4자리를 넣어 주세요','Enter the 4-digit room number')); return; }
  $('#bJoin').disabled=true;
  try{ await ensureNet(); const r=await Net.get('rooms/'+c);
    const inside=r&&r.players&&r.players[uid], cnt=r&&r.players?Object.keys(r.players).length:0;
    if(!r||!r.host){ toast(T('그런 방이 없어요','No room with that number')); }
    else if(!inside&&r.cap&&cnt>=r.cap){ toast(T('방이 꽉 찼어요 ('+r.cap+'명)','The room is full ('+r.cap+' players)')); }
    else if(!inside&&r.state&&r.state.phase==='game'){ toast(T('게임 중이에요. 이번 판이 끝나면 들어와요','A game is in progress — try again after this round')); }
    else{ await Net.set('rooms/'+c+'/players/'+uid,{name:myName,joined:(r.players&&r.players[uid]&&r.players[uid].joined)||Net.TS,on:true}); await enter(c); }
  }catch(e){ console.error(e); if(Net) toast(T('들어가지 못했어요','Could not join')); }
  $('#bJoin').disabled=false;
}
async function enter(c){
  code=c; room=null; lastPhaseKey='';
  Net.onDisc('rooms/'+c+'/players/'+uid+'/on',false);
  try{ history.replaceState(null,'',location.pathname+'?'+(IN_APP?'app=1&':'')+(MOCK?'mock=1&':'')+'lang='+LANG+'&r='+c); }catch(e){}
  unsub.forEach(f=>f()); unsub=[];
  unsub.push(Net.on('rooms/'+c,r=>{ const was=room; room=r;
    if(!r||!r.host){ if(was){ toast(T('방이 닫혔어요','The room was closed')); } leaveLocal(); return; }
    if(r.players&&r.players[uid]&&r.players[uid].on===false) Net.set('rooms/'+c+'/players/'+uid+'/on',true);
    if(!r.players||!r.players[uid]){ toast(T('방에서 나왔어요','You left the room')); leaveLocal(); return; }
    render(); hostTick(); }));
  unsub.push(Net.on('secrets/'+c+'/'+uid,s=>{ mySecret=s; if(room) render(); }));
  drawQR(c); show('#sLobby');
}
function leaveLocal(){ if(code&&Net) Net.cancelDisc('rooms/'+code+'/players/'+uid+'/on').catch(()=>{}); unsub.forEach(f=>f()); unsub=[]; code=null; room=null; mySecret=null; clearInterval(hostTimer); hostTimer=null; show('#sEntry'); try{ history.replaceState(null,'',location.pathname+'?'+(IN_APP?'app=1&':'')+(MOCK?'mock=1&':'')+'lang='+LANG); }catch(e){} }
async function leaveRoom(){ if(!code) return show('#sEntry'); const c=code;
  try{ await Net.cancelDisc('rooms/'+c+'/players/'+uid+'/on');
    if(isHost()){ await Net.remove('secrets/'+c); await Net.remove('rooms/'+c); await Net.remove('roomIdx/'+c).catch(()=>{}); } else await Net.remove('rooms/'+c+'/players/'+uid); }catch(e){}
  leaveLocal(); }

/* ===== QR ===== */
function drawQR(c){ const box=$('#qr'); box.innerHTML='';
  try{ const q=qrcode(0,'M'); q.addData(JOIN_URL+'?r='+c); q.make(); const n=q.getModuleCount(), cv=document.createElement('canvas'), s=4; cv.width=cv.height=n*s; const x=cv.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,n*s,n*s); x.fillStyle='#14162B'; for(let r=0;r<n;r++) for(let k=0;k<n;k++) if(q.isDark(r,k)) x.fillRect(k*s,r*s,s,s); box.appendChild(cv); }catch(e){ box.textContent='QR'; } }

const GAP=800, NUNCHI_LIMIT=30000;
function nunchiCalls(st){ const a=room.acts||{}; return arr(st.ids).filter(id=>a[id]&&a[id].r===st.round&&a[id].t).map(id=>({id,t:a[id].t})).sort((x,y)=>x.t-y.t); }
function drawNunchi(st){
  const calls=nunchiCalls(st), me=calls.findIndex(c=>c.id===uid), now=Net.now(), pre=now<st.startAt, inGame=arr(st.ids).includes(uid);
  const badSet=new Set(arr(st.result&&st.result.losers));
  let h='';
  const multi=st.result&&arr(st.result.losers).length>1;
  if(st.final&&!st.result) h+='<div class="wait" style="color:var(--red);font-weight:900;font-size:16px">🔥 '+T('결승전','Final')+(st.final>1?' '+st.final:'')+' · '+arr(st.ids).map(nameOf).map(esc).join(' vs ')+'</div>';
  if(st.result){ const L=arr(st.result.losers).map(id=>'<span class="dot" style="background:'+colorOf(id)+'"></span>'+esc(nameOf(id))).join(', ');
    const why=st.result.why==='same'?T('💥 동시에 눌렀어요!','💥 Tapped at the same time!'):T('😅 끝까지 못 눌렀어요!','😅 Never tapped!');
    if(multi){ const left=Math.max(0,Math.ceil(((st.result.nextAt||Net.now()+3000)-Net.now())/1000));
      h+='<div class="result"><div class="why">'+why+'</div><div class="who">'+L+'</div><div class="why" style="color:var(--fg);font-size:16px">'+T('둘 이상이 걸렸어요 → <b>결승</b>으로 독박을 가려요','More than one caught → a <b>final</b> decides who pays')+'</div><div class="count" id="fcd" style="font-size:64px">'+left+'</div></div>'; }
    else h+='<div class="result"><div class="who">'+L+' <em>'+T('독박!','loses!')+'</em></div><div class="why">'+why+'</div></div>';
  } else if(pre){ h+='<div class="count" id="cd">'+Math.ceil((st.startAt-now)/1000)+'</div><div class="wait">'+T('곧 시작해요… 손가락 준비!','Get ready…')+'</div>';
  } else { drawNunchiPlay(st); return; }
  h+='<div class="calls sm">'+calls.map((c,i)=>'<div class="call'+(badSet.has(c.id)?' bad':'')+'"><span class="n">'+(i+1)+'</span><i style="background:'+colorOf(c.id)+'"></i>'+esc(nameOf(c.id))+(c.id===uid?' ('+T('나','me')+')':'')+'</div>').join('')+'</div>';
  $('#stage').innerHTML=h; delete $('#stage').dataset.k;
  stopTick(); if(multi){ tickT=setInterval(()=>{ const e=$('#fcd'); if(!e){ stopTick(); return; } const v=Math.max(0,Math.ceil(((st.result.nextAt||0)-Net.now())/1000)); if(e.textContent!=String(v)) e.textContent=v; },200); }
  if(pre&&!st.result){ stopTick(); tickT=setInterval(()=>{ const n=Net.now(); if(n>=st.startAt){ stopTick(); beep(990,.12); buzz(60); render(); return; } const e=$('#cd'); if(e){ const v=Math.ceil((st.startAt-n)/1000); if(e.textContent!=String(v)){ e.textContent=v; beep(520,.06); } } },50); }
}
function drawNunchiPlay(st){ // 같은 화면을 유지해야 손가락을 대고 있는 동안 끊기지 않아요
  const L=loc(st), calls=nunchiCalls(st), ids=arr(st.ids), inGame=ids.includes(uid), a=room.acts||{}, mine=calls.findIndex(c=>c.id===uid);
  if($('#stage').dataset.k!==L.key+'p'){ $('#stage').dataset.k=L.key+'p';
    $('#stage').innerHTML=finalBanner(st)+'<div class="nubig" id="nuBig"></div><div class="nuhands" id="nuHands"></div>'
      +(inGame?'<button class="bigbtn nubtn" id="nuBtn"></button><div class="wait" id="nuTip"></div>':'<div class="wait">'+T('이번 판은 구경해요','Watching this round')+'</div>')
      +'<div class="calls sm" id="nuCalls"></div>';
    const b=$('#nuBtn'); if(b){ const inside=e=>{ const r=b.getBoundingClientRect(); return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom; };
      b.onpointerdown=e=>{ e.preventDefault(); const s2=room.state; if(L.called||!s2||s2.result) return; try{ b.setPointerCapture(e.pointerId); }catch(_){} L.hold=true; L.in=true; buzz(15); Net.set('rooms/'+code+'/acts/'+uid,{r:s2.round,h:1}); nuPaint(); };
      b.onpointermove=e=>{ if(!L.hold) return; const v=inside(e); if(v!==L.in){ L.in=v; nuPaint(); } };
      b.onpointerup=e=>{ if(!L.hold) return; L.hold=false; const s2=room.state; if(!s2||s2.result) return;
        if(inside(e)){ L.called=true; buzz(40); beep(880,.08); Net.set('rooms/'+code+'/acts/'+uid,{r:s2.round,t:Net.TS}); }
        else { beep(300,.05); Net.set('rooms/'+code+'/acts/'+uid,{r:s2.round,h:0}); } nuPaint(); };
      b.onpointercancel=()=>{ if(!L.hold) return; L.hold=false; const s2=room.state; if(s2) Net.set('rooms/'+code+'/acts/'+uid,{r:s2.round,h:0}); nuPaint(); }; }
  }
  if(mine>=0) L.called=true;
  // 새 번호가 불리면 크게
  if((L.nCalls||0)<calls.length){ L.nCalls=calls.length; const c=calls[calls.length-1]; if(c.id!==uid){ beep(520+calls.length*60,.07); buzz(20); } L.bigAt=performance.now(); }
  const big=$('#nuBig'), c=calls[calls.length-1];

  big.classList.remove('bump'); void big.offsetWidth; if(c&&performance.now()-(L.bigAt||0)<300) big.classList.add('bump');
  $('#nuHands').innerHTML=ids.map(id=>{ const k=calls.findIndex(x=>x.id===id), ac=a[id]&&a[id].r===st.round?a[id]:{}, up=k<0&&ac.h;
    return '<span class="nuh'+(up?' up':'')+(k>=0?' done':'')+'"><i style="background:'+colorOf(id)+'"></i>'+esc(nameOf(id))+(id===uid?T('(나)','(me)'):'')+' <b>'+(k>=0?(k+1):up?'🖐':'·')+'</b></span>'; }).join('');
  $('#nuCalls').innerHTML=calls.map((x,i)=>'<div class="call"><span class="n">'+(i+1)+'</span><i style="background:'+colorOf(x.id)+'"></i>'+esc(nameOf(x.id))+(x.id===uid?' ('+T('나','me')+')':'')+'</div>').join('');
  nuPaint(); stopTick();
}
function nuPaint(){ const st=room&&room.state; if(!st) return; const L=loc(st), b=$('#nuBtn'), tip=$('#nuTip'); if(!b) return; const mine=nunchiCalls(st).findIndex(c=>c.id===uid);
  if(L.called||mine>=0){ b.disabled=true; b.textContent=mine>=0?(mine+1):'…'; tip.textContent=T('외쳤어요! 이제 지켜봐요','Called! Now watch'); return; }

function judgeNunchi(st){ // 방장만
  const calls=nunchiCalls(st), now=Net.now(), ids=st.ids||[];
  for(let i=0;i<calls.length;i++){ const grp=[calls[i]]; while(i+1<calls.length&&calls[i+1].t-calls[i].t<GAP){ i++; grp.push(calls[i]); }
    if(grp.length>1) return {losers:grp.map(c=>c.id),why:'same'}; }
  const last=calls.length?calls[calls.length-1].t:st.startAt;
  if(calls.length>=ids.length-1&&now-last>GAP+300){ const left=ids.filter(id=>!calls.some(c=>c.id===id)); if(left.length) return {losers:left,why:'last'}; }
  if(now-st.startAt>NUNCHI_LIMIT){ const left=ids.filter(id=>!calls.some(c=>c.id===id)); if(left.length) return {losers:left,why:'last'}; }
  return null;
}

async function countVotes(st,force){ // 방장만
  const a=room.acts||{}, ids=st.ids||[], votes={}; let n=0;
  ids.forEach(id=>{ const v=a[id]&&a[id].r===st.round&&a[id].vote; if(v){ n++; votes[v]=(votes[v]||0)+1; } });
  if(!force&&n<ids.filter(id=>room.players[id]&&room.players[id].on!==false).length) return;
  if(!n){ toast(T('아직 아무도 투표하지 않았어요','Nobody has voted yet')); return; }
  const h=await Net.get('secrets/'+code+'/_h'); if(!h) return;
  const max=Math.max(...Object.values(votes)), top=Object.keys(votes).filter(k=>votes[k]===max);
  if(top.length>1){ const cit=top.filter(id=>id!==h.liar); return finishLiar(st,h,[cit[rnd(cit.length)]],'tie'); }
  const acc=top[0];
  if(acc!==h.liar) return finishLiar(st,h,[acc],'wrong');
  const W=(EN?WORDS_EN:WORDS_KO)[h.cat]||[], opts=shuffle([h.word,...shuffle(W.filter(w=>w!==h.word)).slice(0,7)]);
  Net.update('rooms/'+code+'/state',{step:'guess',accused:acc,opts});
}
async function finishLiar(st,h,losers,why,guess){
  await setResult({losers,why,liar:h.liar,word:h.word,guess:guess||null});
}
async function checkGuess(st){
  const a=room.acts||{}, g=a[st.accused]&&a[st.accused].r===st.round&&a[st.accused].guess; if(!g||st.result) return;
  const h=await Net.get('secrets/'+code+'/_h'); if(!h) return;
  if(g===h.word){ const acc=arr(st.ids).filter(id=>id!==h.liar&&a[id]&&a[id].r===st.round&&a[id].vote===h.liar); const pool=acc.length?acc:arr(st.ids).filter(id=>id!==h.liar); finishLiar(st,h,[pool[rnd(pool.length)]],'guessed',g); }
  else finishLiar(st,h,[h.liar],'caught',g);
}

function judgeTimer(st){ const a=room.acts||{}, ids=arr(st.ids), now=Net.now();

  return {losers,why:'timer',margin};
}

      setTimeout(fire,Math.max(0,T0-now)); });
  else if(g==='timer') bots.forEach(id=>{ const v=Math.max(7.5,10+gss()*.3); bAt('tm'+R+id,st.startAt+v*1000,()=>bset(id,{r:R,v:Math.round(v*1000)/1000})); });
  else if(g==='draw'){ if(st.fireAt) bots.forEach(id=>{ const ms=Math.round(240+Math.random()*170); bAt('dr'+R+id,st.fireAt+ms,()=>bset(id,{r:R,ms})); }); }
  else if(g==='race') bots.forEach(id=>{ const k='rc'+R+id; if(BOTM[k]) return; BOTM[k]=1; const Tt=17+Math.random()*9;
      for(let n=1;n<=25;n++) bAt(k+'_'+n,st.startAt+Tt*1000*n/25,()=>bset(id,n<25?{r:R,n,pen:0}:{r:R,n:25,pen:0,time:Math.round(Tt*100)/100})); });
  else if(g==='arch') bots.forEach(id=>{ const k='ar'+R+id; if(BOTM[k]) return; BOTM[k]=1; const sc=[], pick=()=>{ const q=Math.random(); return q<.16?10:q<.42?9:q<.67?8:q<.84?7:q<.94?6:q<.98?5:0; };
      for(let s=0;s<AR_SHOTS;s++){ const v=pick(); bAt(k+'_'+s,st.startAt+2200+s*3000+Math.random()*1200,()=>{ sc.push(v); bset(id,{r:R,sc:sc.slice(),done:sc.length>=AR_SHOTS}); }); } });
  else if(g==='cham'){ if(st.last&&st.last.turn===st.turn) return; const t3=chT3(st); bots.forEach(id=>bAt('ch'+R+'_'+st.turn+id,Math.min(t3+CH_WIN1-80,Math.max(t3-CH_WIN0+60,t3-150+Math.random()*450)),s=>{ if(s.turn!==st.turn) return; bset(id,{r:R,t:s.turn,d:Math.random()<.5?'L':'R',at:Net.now()}); })); }
  else if(g==='cannon'){ const sh=cShooter(st); if(!isBot(sh)||st.shot) return; bAt('cn'+R+'_'+st.seq,Math.max(now,st.startAt)+1300+Math.random()*1300,s=>{ if(s.seq!==st.seq||s.shot||cShooter(s)!==sh) return; const m=cannonAim(s,sh); bset(sh,{r:R,seq:s.seq,a:m.a,p:m.p}); }); }
  else if(TGAMES.includes(g)){ const cur=tgCur(st); if(!isBot(cur)||st.boom) return; const t0=Math.max(st.startAt,st.turnStart||0), key='tg'+R+'_'+st.turn;
    if(g==='balloon'){ const d=.6+Math.random()*1.5; for(let q=1;q<=4;q++) bAt(key+'p'+q,t0+900+d*1000*q/5,s=>{ if(s.turn===st.turn) bset(cur,{r:R,t:s.turn,air:Math.round(d*q/5*1000)/1000}); }); bAt(key,t0+900+d*1000,s=>{ if(s.turn===st.turn) bset(cur,{r:R,t:s.turn,air:Math.round(d*1000)/1000,pass:true}); }); }
    else bAt(key,t0+1200+Math.random()*1800,s=>{ if(s.turn!==st.turn) return; const used=s.used||{}, free=[...Array(TG_N[g]).keys()].filter(k=>!used[k]); if(free.length) bset(cur,{r:R,t:s.turn,k:free[rnd(free.length)]}); }); }
  else if(g==='stack'){ const cur=tgCur(st); if(!isBot(cur)||st.boom) return; const key='sk'+R+'_'+st.turn; if(BOTM[key]) return;
    const t0=Math.max(st.startAt,st.turnStart||0), dl=t0+SK_TURN, tw=arr(st.tower), top=tw[tw.length-1], tol=Math.random()<.2?3:4+Math.random()*14; let at=null, bestT=t0+1500, bestE=1e9;
    for(let t=t0+900;t<dl-600;t+=16){ const e=Math.abs(skX(st,t)-top.x); if(e<bestE){ bestE=e; bestT=t; } if(e<tol){ at=t; break; } }
    const when=at||bestT; bAt(key,when,s=>{ if(s.turn===st.turn) bset(cur,{r:R,t:s.turn,at:when}); }); }
}
function hostTick(){
  if(!isHost()){ clearInterval(hostTimer); hostTimer=null; return; }
  if(!hostTimer) hostTimer=setInterval(()=>{ hostStep(); botStep(); },250);
  hostStep(); botStep();
}
let judging=false;
async function hostStep(){
  if(!room||!isHost()||judging) return; const st=room.state||{}; if(st.phase!=='game') return;
  if(st.result){ // 눈치게임: 2명 이상 걸리면 그 사람들끼리 결승
    const L=arr(st.result.losers);
    if(st.game!=='liar'&&L.length>1&&st.result.nextAt&&Net.now()>=st.result.nextAt){ judging=true;
      try{ await startRound(st.game,L,(st.final||0)+1,(st.round||0)+1); }catch(e){}
      judging=false; }
    return; }
  judging=true;
  try{
    const J={nunchi:judgeNunchi,timer:judgeTimer,draw:judgeDuel,race:judgeRace,arch:s=>simJudge(s,arSum,AR_LIMIT)}[st.game];
    if(st.game==='cannon') await hostCannon(st);
    else if(st.game==='cham') await hostCham(st);
    else if(TGAMES.includes(st.game)) await hostTG(st);
    else if(st.game==='stack') await hostStack(st);
    else if(J){ const r=J(st); if(r&&r.restart) await startRound(st.game,arr(st.ids),st.final||0,(st.round||0)+1,{warn:r.warn,fsIds:r.fsIds}); else if(r) await setResult(r); }
    else if(st.game==='liar'){
      if(st.step==='vote') await countVotes(st,false);
      else if(st.step==='guess') await checkGuess(st);
    }
  }catch(e){ console.error(e); }
  judging=false;
}

function confirmLeave(){ if(!isHost()||online().length<=1) return Promise.resolve(true); return ask(T('방장이 나가면 방이 닫혀요. 나갈까요?','If the host leaves, the room closes. Leave?'),T('나가기','Leave')); }
// 앱(WebView)에서는 confirm()이 안 떠서 직접 만든 확인창을 써요
function ask(msg,okTxt){ return new Promise(res=>{ $('#askMsg').textContent=msg; $('#askOk').textContent=okTxt||T('확인','OK'); $('#askNo').textContent=T('취소','Cancel'); $('#askPop').hidden=false;
  const done=v=>{ $('#askPop').hidden=true; $('#askOk').onclick=$('#askNo').onclick=$('#askPop').onclick=null; res(v); };
  $('#askOk').onclick=()=>done(true); $('#askNo').onclick=()=>done(false); $('#askPop').onclick=e=>{ if(e.target.id==='askPop') done(false); }; }); }
window.appBack=function(){ // 안드로이드 뒤로가기
  if(!$('#askPop').hidden){ $('#askNo').onclick(); return 'ok'; }
  if(!$('#namePop').hidden){ $('#nameNo').onclick(); return 'ok'; }
  if(!$('#fullPop').hidden){ $('#fullPop').hidden=true; return 'ok'; }

  if(!$('#capPop').hidden){ $('#capPop').hidden=true; return 'ok'; }
  if(!$('#sGame').hidden){ $('#gBack').onclick(); return 'ok'; }
  if(!$('#sLobby').hidden){ $('#lBack').onclick(); return 'ok'; }
  if(IN_APP&&history.length>1){ history.back(); return 'ok'; }
  return 'exit';
};
